<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zona Táctica — Modo Extremo</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial;color:white}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;font-weight:bold;text-shadow:0 2px 4px #000;pointer-events:none;z-index:5}
#wave{position:fixed;top:48px;left:50%;transform:translateX(-50%);font-weight:bold;text-shadow:0 2px 4px #000;pointer-events:none;z-index:5}
#help{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:13px;opacity:.8;text-shadow:0 2px 4px #000;white-space:nowrap;z-index:5}
#start{position:fixed;inset:0;display:grid;place-items:center;background:#000b;text-align:center;z-index:10}
#start h1{font-size:42px;margin:0 0 10px}
#start p{opacity:.85}
button{font-size:20px;padding:14px 28px;border:0;border-radius:10px;cursor:pointer}
</style>
</head>
<body>

<canvas id="game"></canvas>

<audio id="musicGame" src="diomedes.mp3" loop preload="auto"></audio>
<audio id="musicDeath" src="baby.mp3" preload="auto"></audio>

<div id="hud">
  <span id="hp">❤️ 100 / 100</span>
  <span id="weapon">⚡ SUBFUSIL AUTOMÁTICO</span>
  <span id="ammo">♾️ BALAS INFINITAS</span>
  <span id="score">Puntos: 0</span>
</div>
<div id="wave">Oleada: 1 · Bots: 0</div>
<div id="help">WASD = mover · Mantén CLIC = disparar · R = reiniciar</div>

<div id="start">
  <div>
    <h1>⚡ ZONA TÁCTICA</h1>
    <p>Modo extremo · Muchos bots · Bots armados · Munición infinita</p>
    <button>JUGAR</button>
  </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W,H,dpr;

function resize(){
  dpr=devicePixelRatio||1;
  W=innerWidth;H=innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

// ================= AUDIO =================
let audioCtx=null;
function initAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
}

const musicGame=document.getElementById("musicGame");
const musicDeath=document.getElementById("musicDeath");
musicGame.volume=0.5;
musicDeath.volume=0.8;

function startGameMusic(){
  musicDeath.pause();
  musicDeath.currentTime=0;
  musicGame.currentTime=0;
  musicGame.play().catch(()=>{});
}
function startDeathMusic(){
  musicGame.pause();
  musicDeath.currentTime=0;
  musicDeath.play().catch(()=>{});
}

function playPlayerShot(){
  initAudio();
  const now=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type="square";
  osc.frequency.setValueAtTime(150,now);
  osc.frequency.exponentialRampToValueAtTime(65,now+0.07);
  gain.gain.setValueAtTime(0.06,now);
  gain.gain.exponentialRampToValueAtTime(0.001,now+0.08);
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.start(now);osc.stop(now+0.09);
}

function playEnemyShot(){
  initAudio();
  const now=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type="sawtooth";
  osc.frequency.setValueAtTime(105,now);
  osc.frequency.exponentialRampToValueAtTime(48,now+0.10);
  gain.gain.setValueAtTime(0.04,now);
  gain.gain.exponentialRampToValueAtTime(0.001,now+0.11);
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.start(now);osc.stop(now+0.12);
}

// ================= VARIABLES =================
const keys={};
let mouseX=W/2,mouseY=H/2;
let playing=false,last=0,score=0,wave=1,spawnTimer=0,waveTimer=0,rafId=0;
let player,enemies=[],bullets=[],enemyBullets=[],particles=[],ammoDrops=[];
let damageFlash=0;
const TILE=64;

const map=[
"########################",
"#......................#",
"#....####........####..#",
"#......................#",
"#..##......##..........#",
"#..##..................#",
"#........####..........#",
"#..................##..#",
"#......##..........##..#",
"#......................#",
"#..####.........####..#",
"#......................#",
"########################"
];

// ================= RESET =================
function reset(){
  initAudio();
  startGameMusic();

  player={x:12*TILE,y:10*TILE,angle:0,speed:3.5,hp:100,maxHp:100,anim:0,shoot:0};
  enemies=[];bullets=[];enemyBullets=[];particles=[];ammoDrops=[];
  score=0;wave=1;spawnTimer=5;waveTimer=0;damageFlash=0;
  playing=true;

  document.getElementById("start").style.display="none";
  last=performance.now();
  updateHud();
  cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(loop);
}

// ================= CONTROLES =================
document.querySelector("#start button").onclick=reset;

addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key.toLowerCase()==="r") reset();
});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false;});
addEventListener("mousemove",e=>{mouseX=e.clientX;mouseY=e.clientY;});
canvas.addEventListener("mousedown",e=>{
  if(e.button===0&&playing){initAudio();keys.fire=true;}
});
addEventListener("mouseup",e=>{if(e.button===0)keys.fire=false;});

// ================= DISPARO JUGADOR =================
function shoot(){
  if(player.shoot>0)return;
  playPlayerShot();
  player.shoot=3.5;
  let angle=player.angle+(Math.random()-.5)*.08;
  bullets.push({
    x:player.x+Math.cos(angle)*30,
    y:player.y+Math.sin(angle)*30,
    vx:Math.cos(angle)*17,
    vy:Math.sin(angle)*17,
    life:60,damage:1.5
  });
  for(let i=0;i<4;i++){
    particles.push({
      x:player.x+Math.cos(angle)*35,
      y:player.y+Math.sin(angle)*35,
      vx:(Math.random()-.5)*5,
      vy:(Math.random()-.5)*5,
      life:12
    });
  }
}

// ================= PAREDES =================
function wall(x,y){
  let gx=Math.floor(x/TILE),gy=Math.floor(y/TILE);
  if(gy<0||gy>=map.length||gx<0||gx>=map[0].length)return true;
  return map[gy][gx]==="#";
}
function canMove(x,y,r=16){
  return !wall(x-r,y-r)&&!wall(x+r,y-r)&&!wall(x-r,y+r)&&!wall(x+r,y+r);
}
function moveEntity(o,dx,dy){
  let r=o.r||16;
  if(canMove(o.x+dx,o.y,r))o.x+=dx;
  if(canMove(o.x,o.y+dy,r))o.y+=dy;
}

// ================= BOTS =================
function spawnEnemy(){
  const spots=[[2,2],[20,2],[2,11],[20,11],[12,2],[20,7],[4,8],[17,4],[8,11],[15,10],[5,3],[18,11]];
  let s=spots[Math.floor(Math.random()*spots.length)];
  let difficulty=1+(wave-1)*.3;
  enemies.push({
    x:s[0]*TILE+32,y:s[1]*TILE+32,r:18,
    hp:Math.ceil(4*difficulty),maxHp:Math.ceil(4*difficulty),
    speed:1.25+Math.min(wave*.14,2.5),
    contactDamage:.08+Math.min(wave*.012,.22),
    shootTimer:20+Math.random()*80,
    shootDistance:300+Math.random()*450,
    shootCooldown:Math.max(18,75-wave*2.5),
    anim:Math.random()*6
  });
}

function enemyShoot(e){
  playEnemyShot();
  let dx=player.x-e.x,dy=player.y-e.y;
  let angle=Math.atan2(dy,dx)+(Math.random()-.5)*.15;
  enemyBullets.push({
    x:e.x+Math.cos(angle)*23,
    y:e.y+Math.sin(angle)*23,
    vx:Math.cos(angle)*7.5,
    vy:Math.sin(angle)*7.5,
    life:110,
    damage:4+Math.min(wave*.35,7)
  });
}

// ================= DROPS =================
function createAmmoDrop(x,y){
  if(Math.random()>.25)return;
  ammoDrops.push({x:x,y:y,life:700,pulse:Math.random()*6});
}
function collectDrops(){
  for(let i=ammoDrops.length-1;i>=0;i--){
    let d=ammoDrops[i];
    if(Math.hypot(player.x-d.x,player.y-d.y)<32){
      score+=2;
      for(let k=0;k<8;k++){
        particles.push({x:d.x,y:d.y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:25});
      }
      ammoDrops.splice(i,1);
    }
  }
}

// ================= UPDATE =================
function update(dt){
  const worldMouseX=player.x+(mouseX-W/2);
  const worldMouseY=player.y+(mouseY-H/2);
  player.angle=Math.atan2(worldMouseY-player.y,worldMouseX-player.x);

  let dx=(keys.d?1:0)-(keys.a?1:0);
  let dy=(keys.s?1:0)-(keys.w?1:0);
  if(dx||dy){
    let l=Math.hypot(dx,dy);
    moveEntity(player,dx/l*player.speed*dt,dy/l*player.speed*dt);
    player.anim+=.4*dt;
  }

  player.shoot=Math.max(0,player.shoot-dt);
  if(keys.fire)shoot();

  // Oleadas
  waveTimer+=dt;
  if(enemies.length===0&&waveTimer>65){
    wave++;waveTimer=0;
    let initial=Math.min(12+wave*3,35);
    for(let i=0;i<initial;i++)spawnEnemy();
  }

  // Spawn continuo
  spawnTimer-=dt;
  const maxEnemies=Math.min(100,25+wave*6);
  if(spawnTimer<=0&&enemies.length<maxEnemies){
    let group=1+Math.floor(Math.random()*Math.min(4,1+wave/3));
    for(let i=0;i<group&&enemies.length<maxEnemies;i++)spawnEnemy();
    spawnTimer=Math.max(5,30-wave*1.5);
  }

  // Balas jugador
  for(const b of bullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(wall(b.x,b.y))b.life=0;
  }
  bullets=bullets.filter(b=>b.life>0);

  // Bots
  for(let i=enemies.length-1;i>=0;i--){
    let e=enemies[i];
    let dx=player.x-e.x,dy=player.y-e.y;
    let distance=Math.hypot(dx,dy)||1;

    if(distance>42){
      moveEntity(e,dx/distance*e.speed*dt,dy/distance*e.speed*dt);
    }
    e.anim+=.25*dt;

    if(distance<42){
      player.hp-=e.contactDamage*dt;
      damageFlash=Math.min(1,damageFlash+.025*dt);
    }

    e.shootTimer-=dt;
    if(distance<e.shootDistance&&e.shootTimer<=0){
      enemyShoot(e);
      e.shootTimer=e.shootCooldown+Math.random()*25;
    }

    for(const b of bullets){
      if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+6){
        e.hp-=b.damage;b.life=0;
        for(let k=0;k<5;k++){
          particles.push({x:e.x,y:e.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:20});
        }
        break;
      }
    }

    if(e.hp<=0){
      createAmmoDrop(e.x,e.y);
      enemies.splice(i,1);
      score++;
      if(score%15===0)player.hp=Math.min(player.maxHp,player.hp+8);
      for(let k=0;k<15;k++){
        particles.push({x:e.x,y:e.y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:30});
      }
    }
  }

  // Balas enemigas
  for(const b of enemyBullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(wall(b.x,b.y)){b.life=0;continue;}
    if(Math.hypot(b.x-player.x,b.y-player.y)<19){
      player.hp-=b.damage;b.life=0;
      damageFlash=Math.min(1,damageFlash+.18);
      for(let k=0;k<7;k++){
        particles.push({x:player.x,y:player.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:18});
      }
    }
  }
  enemyBullets=enemyBullets.filter(b=>b.life>0);

  // Drops
  for(const d of ammoDrops){d.life-=dt;d.pulse+=.18*dt;}
  ammoDrops=ammoDrops.filter(d=>d.life>0);
  collectDrops();

  // Partículas
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}
  particles=particles.filter(p=>p.life>0);

  damageFlash=Math.max(0,damageFlash-.04*dt);

  // ===== MUERTE DEL JUGADOR =====
  if(player.hp<=0){
    player.hp=0;
    playing=false;
    keys.fire=false;

    startDeathMusic();

    document.getElementById("start").style.display="grid";
    document.querySelector("#start div").innerHTML=
      "<h1>💀 MORISTES HIJO DE PERRA</h1>"+
      "<p>Puntos: "+score+"</p>"+
      "<p>Oleada alcanzada: "+wave+"</p>"+
      "<p>Bots eliminados: "+score+"</p>"+
      "<button>JUGAR DE NUEVO</button>";
    document.querySelector("#start button").onclick=reset;
  }

  updateHud();
}

// ================= HUD =================
function updateHud(){
  document.getElementById("hp").textContent="❤️ "+Math.max(0,Math.floor(player.hp))+" / "+player.maxHp;
  document.getElementById("weapon").textContent="⚡ SUBFUSIL AUTOMÁTICO";
  document.getElementById("ammo").textContent="♾️ BALAS INFINITAS";
  document.getElementById("score").textContent="Puntos: "+score;
  document.getElementById("wave").textContent="Oleada: "+wave+" · Bots: "+enemies.length;
}

// ================= CÁMARA =================
function screenX(x){return W/2+(x-player.x);}
function screenY(y){return H/2+(y-player.y);}

// ================= DIBUJAR =================
function draw(){
  ctx.clearRect(0,0,W,H);

  // Mapa
  for(let y=0;y<map.length;y++){
    for(let x=0;x<map[y].length;x++){
      let sx=screenX(x*TILE),sy=screenY(y*TILE);
      if(sx<-TILE||sx>W||sy<-TILE||sy>H)continue;
      ctx.fillStyle=map[y][x]==="#"?"#344047":"#71806e";
      ctx.fillRect(sx,sy,TILE+1,TILE+1);
      if(map[y][x]==="."){
        ctx.fillStyle="#697866";
        ctx.fillRect(sx+2,sy+2,TILE-4,TILE-4);
      }else{
        ctx.fillStyle="#20272b";
        ctx.fillRect(sx+5,sy+5,TILE-10,TILE-10);
      }
    }
  }

  // Sombras
  ctx.globalAlpha=.25;
  for(const e of enemies){
    ctx.fillStyle="#000";
    ctx.beginPath();
    ctx.ellipse(screenX(e.x),screenY(e.y)+15,22,8,0,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  // Drops
  for(const d of ammoDrops){
    let x=screenX(d.x),y=screenY(d.y);
    let pulse=Math.sin(d.pulse)*3;
    ctx.fillStyle="#ffe066";
    ctx.beginPath();ctx.arc(x,y,12+pulse,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#222";
    ctx.fillRect(x-8,y-5,16,10);
    ctx.fillStyle="#fff";
    ctx.font="bold 13px Arial";
    ctx.textAlign="center";
    ctx.fillText("∞",x,y+4);
  }

  // Balas jugador
  ctx.fillStyle="#ffe36e";
  for(const b of bullets){
    ctx.beginPath();ctx.arc(screenX(b.x),screenY(b.y),4,0,Math.PI*2);ctx.fill();
  }

  // Balas bots
  for(const b of enemyBullets){
    let x=screenX(b.x),y=screenY(b.y);
    ctx.strokeStyle="#ff7777";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x-b.vx*1.8,y-b.vy*1.8);ctx.lineTo(x,y);ctx.stroke();
    ctx.fillStyle="#ff3b3b";
    ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();
  }

  // Bots
  for(const e of enemies){
    let x=screenX(e.x),y=screenY(e.y);
    let bob=Math.sin(e.anim)*2;

    ctx.fillStyle="#222";ctx.fillRect(x-22,y-35,44,6);
    ctx.fillStyle="#e53935";ctx.fillRect(x-22,y-35,44*Math.max(0,e.hp/e.maxHp),6);

    ctx.fillStyle="#111";
    ctx.beginPath();ctx.arc(x,y+5,18,0,Math.PI*2);ctx.fill();

    ctx.fillStyle="#d85b4e";
    ctx.beginPath();ctx.arc(x,y-7+bob,12,0,Math.PI*2);ctx.fill();

    ctx.fillStyle="#29333a";ctx.fillRect(x-13,y+4+bob,26,25);
    ctx.fillStyle="#15191c";ctx.fillRect(x+8,y+3,22,5);

    ctx.fillStyle="#fff";
    ctx.fillRect(x-7,y-9+bob,4,3);
    ctx.fillRect(x+4,y-9+bob,4,3);
  }

  // Jugador
  let px=W/2,py=H/2;
  let moving=keys.w||keys.a||keys.s||keys.d;
  let bob=moving?Math.sin(player.anim)*3:0;

  ctx.fillStyle="#0006";
  ctx.beginPath();ctx.ellipse(px,py+25,25,9,0,0,Math.PI*2);ctx.fill();

  ctx.save();
  ctx.translate(px,py+bob);
  ctx.rotate(player.angle);

  ctx.fillStyle="#17232a";ctx.fillRect(-15,-2,30,34);
  ctx.fillStyle="#4ba9d1";
  ctx.beginPath();ctx.arc(0,-13,13,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#20272b";ctx.fillRect(10,-4,42,7);
  ctx.fillStyle="#111";
  ctx.fillRect(-13,18,9,16);
  ctx.fillRect(4,18,9,16);

  ctx.restore();

  // Partículas
  ctx.fillStyle="#f3c35c";
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/30);
    ctx.fillRect(screenX(p.x),screenY(p.y),4,4);
  }
  ctx.globalAlpha=1;

  // Mira
  ctx.strokeStyle="#fff";ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(mouseX,mouseY,10,0,Math.PI*2);
  ctx.moveTo(mouseX-16,mouseY);ctx.lineTo(mouseX-5,mouseY);
  ctx.moveTo(mouseX+5,mouseY);ctx.lineTo(mouseX+16,mouseY);
  ctx.moveTo(mouseX,mouseY-16);ctx.lineTo(mouseX,mouseY-5);
  ctx.moveTo(mouseX,mouseY+5);ctx.lineTo(mouseX,mouseY+16);
  ctx.stroke();
}

// ================= LOOP =================
function loop(t){
  if(!playing)return;
  let dt=Math.min(2,(t-last)/16.67);
  last=t;
  update(dt);
  draw();
  if(playing)rafId=requestAnimationFrame(loop);
}
</script>
</body>
</html>
